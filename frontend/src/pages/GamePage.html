<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cards Against Humanity – Player View</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: clamp(12px, 1.4vw, 16px);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Top nav ── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(6px, 1vh, 24px) clamp(12px, 2vw, 40px);
      background: #111;
      border-bottom: 1px solid #333;
    }

    .btn-leave {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: clamp(4px, 0.6vh, 7px) clamp(8px, 1vw, 13px);
      font-size: clamp(10px, 0.9vw, 15px);
      font-weight: 600;
      cursor: pointer;
    }

    .room-title { font-size: clamp(12px, 1.4vw, 22px); font-weight: 700; letter-spacing: 1px; }

    .player-info { display: flex; align-items: center; gap: 6px; font-size: clamp(10px, 0.9vw, 16px); }
    .avatar {
      width: clamp(18px, 1.6vw, 24px);
      height: clamp(18px, 1.6vw, 24px);
      border-radius: 50%;
      background: #555; display: flex; align-items: center;
      justify-content: center;
      font-size: clamp(10px, 0.9vw, 13px);
    }

    /* ── Main area ── */
    .main {
      display: flex;
      flex: 1;
      padding: clamp(10px, 1.5vh, 20px) clamp(16px, 8%, 120px);
      gap: clamp(12px, 2vw, 32px);
      overflow: hidden;
      justify-content: space-around;
    }

    /* Left column */
    .left-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: clamp(180px, 18vw, 260px);
      flex-shrink: 0;
      font-size: 2rem;
    }

    .round-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(14px, 1.4vw, 18px);
      width: 100%;
    }

    .timer { display: flex; align-items: center; gap: 6px; font-size: clamp(14px, 1.4vw, 18px); }

    .black-card {
      background: #000;
      border: 2px solid #444;
      border-radius: clamp(6px, 0.8vw, 12px);
      width: 100%;
      max-width: 100%;
      height: auto;
      padding: clamp(12px, 1.5vw, 20px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      aspect-ratio: 8/11;
    }

    .black-card p { font-size: clamp(11px, 1.1vw, 16px); font-weight: 600; line-height: 1.5; padding-top: clamp(1rem, 3vh, 3rem); }
    .card-tag { font-size: clamp(9px, 0.8vw, 11px); color: #aaa; }

    .czar-label { text-align: center; font-size: clamp(14px, 1.4vw, 18px); color: #ccc; }

    /* Right column */
    .right-col {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
    }

    .submit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-submit {
      border: 2px solid #7c3aed;
      background: transparent;
      color: #fff;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: clamp(13px, 1.2vw, 15px);
      font-weight: 600;
      cursor: pointer;
    }

    .progress { display: flex; align-items: center; gap: 6px; font-size: clamp(13px, 1.2vw, 15px); }
    .check { color: #7c3aed; font-size: clamp(16px, 1.5vw, 20px); }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(6px, 1vw, 16px);
      overflow-y: auto;
      scrollbar-width: none;
    }

    .white-card {
      background: #fff;
      color: #000;
      border: 2px solid #ccc;
      border-radius: clamp(6px, 0.8vw, 10px);
      padding: clamp(10px, 1.2vw, 16px);
      padding-top: clamp(3rem, 6vh, 6rem);
      height: auto;
      width: 100%;
      aspect-ratio: 70/97;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      cursor: pointer;
      font-size: clamp(11px, 1.1vw, 16px);
      font-weight: 600;
      transition: transform 0.1s, border-color 0.1s;
    }

    .white-card:hover { transform: scale(1.02); }
    .white-card.selected { border: 3px solid #7c3aed; }
    .white-card .card-tag { font-size: clamp(8px, 0.7vw, 10px); color: #888; font-weight: 400; }

    /* ── Bottom ── */
    .bottom {
      display: grid;
      grid-template-columns: minmax(140px, 20vw) 1fr minmax(100px, 15vw);
      border-top: 1px solid #333;
      background: #111;
      min-height: clamp(140px, 20vh, 240px);
      max-height: clamp(160px, 25vh, 280px);
      overflow: hidden;
    }

    .players-panel { border-right: 1px solid #333; padding: 12px; }

    .players-panel table { width: 100%; border-collapse: collapse; font-size: clamp(11px, 1.1vw, 14px); }
    .players-panel th {
      text-align: left; padding-bottom: 6px; color: #ccc;
      border-bottom: 1px solid #444;
    }
    .players-panel th:last-child { text-align: right; }
    .players-panel td { padding: 4px 0; }
    .players-panel td:last-child { text-align: right; }
    .players-panel tfoot td { border-top: 1px solid #444; padding-top: 6px; color: #ccc; }

    .log-panel { padding: 16px 24px; border-right: 1px solid #333; }
    .log-panel h3 { font-size: clamp(14px, 1.4vw, 18px); font-weight: 700; margin-bottom: 8px; }
    .log-panel p { font-size: clamp(12px, 1.1vw, 14px); color: #ccc; margin-bottom: 4px; }
    .log-panel p.dim { color: #888; }

    .leaderboard-panel {
      padding: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: clamp(13px, 1.2vw, 16px);
      font-weight: 600;
      color: #ccc;
    }
    @media (max-width: 768px) {
      body { overflow: auto; height: auto; }

      .topnav {
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px 14px;
      }

      .room-title {
        font-size: clamp(12px, 3.5vw, 16px);
        letter-spacing: 0;
        order: 3;
        width: 100%;
        text-align: center;
      }

      .btn-leave { order: 1; }
      .player-info { order: 2; }

      .main {
        flex-direction: column;
        overflow: visible;
        padding: 16px;
      }

      .left-col { width: 100%; align-items: center; }
      .black-card { max-width: 180px; }

      .cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }

      .bottom {
        grid-template-columns: 1fr;
        max-height: none;
      }

      .players-panel { border-right: none; border-bottom: 1px solid #333; }
      .log-panel { border-right: none; border-bottom: 1px solid #333; }
    }
  </style>
</head>
<body>

  <!-- Top nav -->
  <nav class="topnav">
    <button class="btn-leave">&lt; Leave Room</button>
    <span class="room-title">ROOM: ROOM_NAME</span>
    <div class="player-info">
      <div class="avatar">👤</div>
      <span>Player1</span>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">

    <!-- Left: black card -->
    <div class="left-col">
      <div class="round-row">
        <span>Round [ ]</span>
        <div class="timer"><span>[sec]</span><span>⏱</span></div>
      </div>

      <div class="black-card">
        <p>_____: kid tested, mother approved.</p>
        <span class="card-tag">cards against humanity</span>
      </div>

      <div class="czar-label">[Czar Name]</div>
    </div>

    <!-- Right: white cards -->
    <div class="right-col">
      <div class="submit-row">
        <button class="btn-submit">Submit</button>
        <div class="progress"><span>0/1</span><span class="check">✔</span></div>
      </div>

      <div class="cards-grid" id="cardsGrid"></div>
    </div>

  </div>

  <!-- Bottom -->
  <div class="bottom">

    <div class="players-panel">
      <table>
        <thead>
          <tr><th>Players</th><th style="text-align:right">Score</th></tr>
        </thead>
        <tbody>
          <tr><td>Player1</td><td>10</td></tr>
          <tr><td>Player2</td><td>4</td></tr>
          <tr><td>Player3</td><td>21</td></tr>
          <tr><td>Player4</td><td>3</td></tr>
          <tr><td>Player5</td><td>2</td></tr>
        </tbody>
        <tfoot>
          <tr><td>Players</td><td style="text-align:right">Score</td></tr>
        </tfoot>
      </table>
    </div>

    <div class="log-panel">
      <h3>Round 2 started!</h3>
      <p>Player 1 has won the round</p>
      <p class="dim">Basically the logs will be displayed here</p>
    </div>

    <div class="leaderboard-panel">Leaderboard</div>

  </div>

  <script>
    const cardTexts = [
      "Child labor","Child labor","Child labor","Child labor",
      "Child labor","Child labor","Child labor","Child labor", "Child labor", "Child labor"
    ];

    const grid = document.getElementById('cardsGrid');

    cardTexts.forEach((text) => {
      const card = document.createElement('button');
      card.className = 'white-card';
      card.innerHTML = `<span>${text}</span><span class="card-tag">cards against humanity</span>`;
      card.addEventListener('click', () => card.classList.toggle('selected'));
      grid.appendChild(card);
    });
  </script>

</body>
</html>
